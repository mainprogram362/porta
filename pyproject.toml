[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "porta"
version = "0.1.0"
description = "PORTA personal productivity and automation application suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6",
  "yt-dlp[default]",
  "pyautogui",
  "pyperclip",
  "chardet",
]

[project.optional-dependencies]
# The application works without this third-party helper. When installed with
# a locally pinned Provider runtime, it enables the explicit PO Token retry.
youtube-po-token = ["bgutil-ytdlp-pot-provider==1.3.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
